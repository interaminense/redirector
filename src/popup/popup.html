<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirector</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="popup-header">
      <h1>Redirector</h1>
      <label class="switch">
        <input type="checkbox" id="global-toggle" />
        <span class="slider"></span>
      </label>
    </header>

    <div id="sync-error" class="sync-error hidden"></div>

    <div id="status" class="status"></div>

    <ul id="rule-list" class="rule-list"></ul>

    <div id="empty" class="empty hidden">
      No rules yet. Click "Manage rules" to create your first redirect.
    </div>

    <footer class="popup-footer">
      <button id="manage-btn" class="primary">Manage rules</button>
    </footer>

    <script type="module" src="popup.js"></script>
  </body>
</html>
